<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CHAMBER</title>
<style>
body{margin:0;background:#0a0a0b;color:#fafafa;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh}
.logo{font-size:32px;font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#ef4444,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.spin{width:36px;height:36px;border:3px solid #27272a;border-top-color:#ef4444;border-radius:50%;margin:20px auto;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.t{font-size:13px;color:#a1a1aa;text-align:center}
</style>
</head>
<body>
<div>
  <div class="logo">CHAMBER</div>
  <div class="spin"></div>
  <div class="t">در حال ورود به میدان...</div>
</div>
<script>
(function(){
  var p=location.pathname||'/';
  if(/\/index\.html$/i.test(p)) p=p.replace(/\/index\.html$/i,'/');
  else if(!p.endsWith('/')) p=p.replace(/\/[^/]*$/,'/') ;
  location.replace(p+'app/');
})();
</script>
</body>
</html>
