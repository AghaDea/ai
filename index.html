<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131b">
<title>مرکز اعلان‌ها</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #10131b;
    color: #f5f6fc;
    font-family: Tahoma, Arial, sans-serif;
    padding: 20px 14px;
}

main {
    max-width: 460px;
    margin: 25px auto;
}

.card {
    background: #191e2a;
    border: 1px solid #2b3345;
    border-radius: 22px;
    padding: 22px;
}

h1 {
    font-size: 23px;
    margin: 0 0 10px;
}

.description {
    font-size: 13px;
    line-height: 2;
    color: #aab3c5;
}

.status {
    background: #111722;
    border: 1px solid #30394b;
    border-radius: 12px;
    padding: 13px;
    margin: 18px 0;
    font-size: 12px;
    line-height: 2;
    overflow-wrap: anywhere;
}

label {
    display: block;
    font-size: 13px;
    margin: 17px 0 8px;
}

input, textarea {
    width: 100%;
    border: 1px solid #353e52;
    background: #111722;
    color: white;
    border-radius: 12px;
    padding: 14px;
    outline: none;
    font-family: inherit;
    font-size: 14px;
}

input:focus, textarea:focus {
    border-color: #8978ff;
}

textarea {
    min-height: 105px;
    resize: vertical;
    line-height: 1.9;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 15px;
    margin-top: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

button:disabled {
    opacity: .5;
    cursor: wait;
}

.primary {
    background: #7966ff;
    color: white;
}

.secondary {
    background: #293246;
    color: white;
}

.danger {
    background: #482b36;
    color: #ffdce5;
}

.footer {
    margin-top: 17px;
    color: #8995aa;
    font-size: 11px;
    line-height: 2;
}
</style>
</head>

<body>
<main>
<div class="card">

    <h1>مرکز اعلان‌ها</h1>

    <div class="description">
        عنوان و پیام اعلان را وارد کن و دکمه ارسال را بزن.
        اعلان در سیستم اندروید نمایش داده می‌شود.
    </div>

    <div class="status" id="status">
        در حال آماده‌سازی...
    </div>

    <label for="titleInput">عنوان اعلان</label>
    <input
        id="titleInput"
        type="text"
        maxlength="100"
        value="اعلان جدید"
        autocomplete="off"
    >

    <label for="bodyInput">متن اعلان</label>
    <textarea
        id="bodyInput"
        maxlength="500"
    >سلام! این یک اعلان از سایت من است.</textarea>

    <button class="secondary" id="permissionButton">
        فعال‌سازی اجازه اعلان
    </button>

    <button class="primary" id="sendButton" disabled>
        ارسال اعلان
    </button>

    <button class="secondary" id="testButton" disabled>
        ارسال اعلان آزمایشی
    </button>

    <button class="danger" id="closeButton" disabled>
        بستن اعلان قبلی
    </button>

    <div class="footer">
        این نسخه بدون Firebase، Supabase و سرور است.
        اعلان فقط در زمان اجرای صفحه و پس از کلیک کاربر
        درخواست می‌شود. ارسال از راه دور پس از بستن سایت
        پشتیبانی نمی‌شود.
    </div>

</div>
</main>

<script>
"use strict";

const statusBox = document.getElementById("status");
const permissionButton = document.getElementById("permissionButton");
const sendButton = document.getElementById("sendButton");
const testButton = document.getElementById("testButton");
const closeButton = document.getElementById("closeButton");

let registration = null;
let ready = false;
let busy = false;

function setStatus(message) {
    statusBox.textContent = message;
}

function setButtons(enabled) {
    sendButton.disabled = !enabled;
    testButton.disabled = !enabled;
    closeButton.disabled = !enabled;
}

async function initialize() {
    setButtons(false);

    if (!window.isSecureContext) {
        setStatus("خطا: سایت باید با HTTPS باز شود.");
        return;
    }

    if (!("serviceWorker" in navigator)) {
        setStatus("این مرورگر از Service Worker پشتیبانی نمی‌کند.");
        return;
    }

    if (!("Notification" in window)) {
        setStatus("این مرورگر اعلان سیستم را پشتیبانی نمی‌کند.");
        return;
    }

    try {
        registration = await navigator.serviceWorker.register("./sw.js");

        await navigator.serviceWorker.ready;

        ready = true;
        setButtons(true);

        if (Notification.permission === "granted") {
            setStatus("آماده است. اجازه اعلان فعال است.");
        } else if (Notification.permission === "denied") {
            setStatus(
                "اعلان مسدود است. تنظیمات سایت در Chrome را باز کن " +
                "و اجازه Notifications را فعال کن."
            );
        } else {
            setStatus("آماده است. ابتدا اجازه اعلان را فعال کن.");
        }
    } catch (error) {
        setStatus("خطا در راه‌اندازی: " + error.message);
    }
}

async function enableNotifications() {
    if (!ready) {
        setStatus("سرویس اعلان هنوز آماده نیست.");
        return;
    }

    try {
        if (Notification.permission === "denied") {
            setStatus(
                "اجازه قبلاً مسدود شده است. از تنظیمات Chrome، " +
                "مجوز اعلان این سایت را تغییر بده."
            );
            return;
        }

        if (Notification.permission === "default") {
            const result = await Notification.requestPermission();

            if (result !== "granted") {
                setStatus("اجازه اعلان داده نشد.");
                return;
            }
        }

        setStatus("اجازه اعلان فعال است. اکنون می‌توانی ارسال کنی.");
    } catch (error) {
        setStatus("خطا در دریافت اجازه: " + error.message);
    }
}

async function sendNotification(title, body) {
    if (!ready || !registration) {
        setStatus("سرویس اعلان آماده نیست.");
        return;
    }

    if (busy) {
        setStatus("درخواست قبلی هنوز در حال اجراست.");
        return;
    }

    if (Notification.permission !== "granted") {
        setStatus("ابتدا دکمه فعال‌سازی اجازه اعلان را بزن.");
        return;
    }

    if (!title.trim() || !body.trim()) {
        setStatus("عنوان و متن اعلان نباید خالی باشند.");
        return;
    }

    busy = true;
    sendButton.disabled = true;
    testButton.disabled = true;

    try {
        await registration.showNotification(title.trim(), {
            body: body.trim(),

            // اعلان‌های این سایت را با یک شناسه جایگزین می‌کند.
            tag: "aghadea-custom-notification",

            // هنگام جایگزینی، صدای اعلان مجدداً درخواست نمی‌شود.
            renotify: false,

            timestamp: Date.now(),

            data: {
                url: location.href
            }
        });

        setStatus("درخواست نمایش اعلان ارسال شد.");
    } catch (error) {
        setStatus("خطای نمایش اعلان: " + error.message);
    } finally {
        busy = false;
        sendButton.disabled = false;
        testButton.disabled = false;
    }
}

permissionButton.addEventListener("click", enableNotifications);

sendButton.addEventListener("click", () => {
    const title = document.getElementById("titleInput").value;
    const body = document.getElementById("bodyInput").value;

    sendNotification(title, body);
});

testButton.addEventListener("click", () => {
    sendNotification(
        "اعلان آزمایشی",
        "اعلان سیستم گوشی شما از طریق سایت درخواست شده است."
    );
});

closeButton.addEventListener("click", async () => {
    if (!registration) return;

    try {
        const notifications = await registration.getNotifications({
            tag: "aghadea-custom-notification"
        });

        notifications.forEach(notification => notification.close());

        setStatus(
            notifications.length
                ? "اعلان قبلی بسته شد."
                : "اعلان فعالی برای بستن پیدا نشد."
        );
    } catch (error) {
        setStatus("خطا هنگام بستن اعلان: " + error.message);
    }
});

initialize();
</script>
</body>
</html>
