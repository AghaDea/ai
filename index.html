<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guessino</title>
<style>
  body{margin:0;background:#05070a;color:#e8eef7;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;min-height:100dvh}
  .boot{text-align:center}
  .logo{font-size:28px;font-weight:800;letter-spacing:-.5px}
  .logo span{color:#3b82f6}
  .spin{width:36px;height:36px;border:3px solid #1e293b;border-top-color:#3b82f6;border-radius:50%;margin:24px auto;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .txt{font-size:13px;color:#64748b}
</style>
<script src="Config/load-config.js"></script>
<script>
(function () {
  function baseDir() {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) {
      if (/\.[a-zA-Z0-9]+$/.test(path.split('/').pop())) path = path.replace(/\/[^/]*$/, '/');
      else path = path + '/';
    }
    return path;
  }
  function go(p) {
    try { location.replace(baseDir() + p); }
    catch (e) { location.replace('/' + p); }
  }
  function active(row) {
    if (!row || !row.enabled) return false;
    if (!row.ends_at) return true;
    var end = Date.parse(row.ends_at);
    return isFinite(end) && end > Date.now();
  }
  async function boot() {
    var URL = '', KEY = '';
    try {
      var cfg = await loadGzConfig();
      URL = cfg.SUPABASE_URL || '';
      KEY = cfg.SUPABASE_ANON_KEY || '';
    } catch (e) {}
    if (URL && KEY) {
      try {
        var r = await fetch(URL + '/rest/v1/rpc/site_update_normalize', {
          method: 'POST',
          headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
          body: '{}'
        });
        if (r.ok) {
          var data = await r.json();
          if (data && data.ok && data.active) { go('update/'); return; }
        }
      } catch (e) {}
    }
    try {
      if (localStorage.getItem('gz_user_id') && localStorage.getItem('gz_session_ok')) go('app/');
      else go('login/');
    } catch (e) { go('login/'); }
  }
  boot();
})();
</script>
</head>
<body>
  <div class="boot">
    <div class="logo">Guess<span>ino</span></div>
    <div class="spin"></div>
    <div class="txt">در حال بارگذاری...</div>
  </div>
</body>
</html>
