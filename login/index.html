<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guessino · ورود</title>
<link rel="stylesheet" href="css/style.css">
<script src="../Config/load-config.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo">Guess<span>ino</span></div>
    <div class="sub" id="authSub">وارد حساب خود شوید</div>
    <div id="authError" class="err hidden"></div>

    <div class="field">
      <label>نام کاربری</label>
      <input id="username" maxlength="16" placeholder="۲ تا ۱۶ کاراکتر" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input id="password" type="password" maxlength="64" placeholder="حداقل ۴ کاراکتر" autocomplete="current-password">
    </div>

    <button id="submitBtn" class="btn primary">ورود</button>
    <div class="switch">
      حساب نداری؟ <a id="switchLink">ثبت‌نام</a>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
