<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CHAMBER · ورود</title>
<link rel="stylesheet" href="css/style.css">
<script src="../Config/load-config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">CHAMBER</div>
    <p class="sub" id="sub">وارد حساب شو یا همین‌طور مهمان بمان</p>

    <div class="tabs">
      <button type="button" class="tab active" data-mode="login">ورود</button>
      <button type="button" class="tab" data-mode="signup">ثبت‌نام</button>
    </div>

    <div id="err" class="err hidden"></div>

    <div class="field">
      <label>نام کاربری</label>
      <input id="username" maxlength="16" placeholder="۳ تا ۱۶ کاراکتر" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input id="password" type="password" maxlength="64" placeholder="حداقل ۴ کاراکتر" autocomplete="current-password">
    </div>

    <button type="button" class="btn primary" id="submitBtn">ورود</button>
    <button type="button" class="btn ghost" id="guestBtn">ادامه به‌عنوان مهمان</button>
  </div>
  <p class="hint">مهمان: نام تصادفی · هیچ آماری ذخیره نمی‌شود</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/script.js"></script>
</body>
</html>
