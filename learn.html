<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یادگیری — HTML Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/learn.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <header class="dashboard-header">
    <div class="logo">HTML Studio</div>
    <div class="header-right">
      <a href="dashboard.html" class="btn btn-secondary btn-sm">پروژه‌های من</a>
      <button class="btn btn-secondary btn-sm" id="logout-btn">خروج</button>
    </div>
  </header>

  <!-- انتخاب مسیر یادگیری -->
  <div class="track-selector" id="track-selector">
    <div class="track-container">
      <h1>کدوم مسیر رو می‌خوای بری؟</h1>
      <p class="track-subtitle">دو تا مسیر کامل و جدا از هم برات آماده کردم. هر کدوم رو که خواستی انتخاب کن.</p>
      
      <div class="track-cards">
        <button class="track-card" id="track-visual">
          <div class="track-icon">🎨</div>
          <h2>مسیر ظاهر</h2>
          <p>HTML + CSS کامل</p>
          <ul>
            <li>ساختار HTML از صفر تا صد</li>
            <li>همه تگ‌های مهم</li>
            <li>CSS کامل (رنگ، فونت، Flexbox، Grid)</li>
            <li>ریسپانسیو و انیمیشن</li>
            <li>تمرین‌های عملی زیاد</li>
          </ul>
          <span class="track-btn">شروع مسیر ظاهر ←</span>
        </button>

        <button class="track-card" id="track-script">
          <div class="track-icon">⚡</div>
          <h2>مسیر اسکریپت</h2>
          <p>JavaScript کامل</p>
          <ul>
            <li>مفاهیم پایه جاوااسکریپت</li>
            <li>کار با DOM و رویدادها</li>
            <li>آرایه، آبجکت، توابع</li>
            <li>Async و Fetch</li>
            <li>پروژه‌های تعاملی</li>
          </ul>
          <span class="track-btn">شروع مسیر اسکریپت ←</span>
        </button>
      </div>
    </div>
  </div>

  <!-- صفحه اصلی یادگیری (بعد از انتخاب مسیر) -->
  <div class="learn-layout hidden" id="learn-layout">
    <aside class="learn-sidebar">
      <div class="sidebar-top">
        <button class="btn-back-tracks" id="back-to-tracks">→ تغییر مسیر</button>
        <h3 id="current-track-title">مسیر ظاهر</h3>
      </div>
      <nav id="lesson-nav"></nav>
    </aside>

    <main class="learn-content" id="lesson-content">
      <!-- محتوا اینجا لود می‌شه -->
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
