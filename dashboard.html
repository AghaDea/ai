<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد — HTML Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <header class="dashboard-header">
    <div class="logo">HTML Studio</div>
    <div class="header-right">
      <a href="learn.html" class="btn btn-secondary btn-sm">📚 یادگیری</a>
      <span class="user-email" id="user-email">...</span>
      <button class="btn btn-secondary btn-sm" id="logout-btn">خروج</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-toolbar">
      <h2>پروژه‌های من</h2>
      <button class="btn btn-primary" id="create-project-btn">
        + پروژه جدید
      </button>
    </div>

    <div id="loading" class="loading">دارم پروژه‌هات رو می‌آرم...</div>

    <div id="empty-state" class="empty-state hidden">
      <h3>هنوز پروژه‌ای نساختی</h3>
      <p>اولین پروژه‌ت رو بساز و شروع کن به کدنویسی. هر چی لازم داری اینجاست.</p>
      <button class="btn btn-primary" onclick="document.getElementById('create-project-btn').click()">
        اولین پروژه رو بساز
      </button>
    </div>

    <div id="projects-list" class="projects-grid"></div>
  </main>

  <!-- مودال ساخت پروژه -->
  <div id="create-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>پروژه جدید</h3>
        <button class="modal-close" id="close-modal">×</button>
      </div>
      <form id="create-project-form">
        <div class="form-group">
          <label for="project-name">اسم پروژه</label>
          <input type="text" id="project-name" placeholder="مثلاً صفحه شخصی من" required maxlength="60">
        </div>
        <div class="form-group">
          <label for="project-desc">توضیح کوتاه (اختیاری)</label>
          <input type="text" id="project-desc" placeholder="یه توضیح کوچیک در موردش" maxlength="120">
        </div>
        <button type="submit" class="btn btn-primary">بساز</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
