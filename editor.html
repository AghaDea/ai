<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ادیتور — HTML Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  
  <!-- CodeMirror برای هایلایت سینتکس رنگی -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
</head>
<body class="editor-page">
  <!-- هدر -->
  <header class="editor-header">
    <div class="editor-header-left">
      <button class="btn btn-secondary btn-sm" id="back-btn">← داشبورد</button>
      <h1 id="project-title">در حال لود...</h1>
    </div>
    <div class="editor-header-right">
      <span id="save-status">ذخیره شده</span>
      <button class="btn btn-secondary btn-sm" id="save-btn">ذخیره</button>
      <button class="btn btn-primary btn-sm" id="preview-btn">پیش‌نمایش</button>
      <button class="btn btn-secondary btn-sm" id="logout-btn">خروج</button>
    </div>
  </header>

  <!-- بدنه اصلی -->
  <div class="editor-body">
    <!-- سایدبار فایل‌منیجر -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>فایل‌ها</h3>
        <div class="sidebar-actions">
          <button class="btn-tiny" id="add-file-btn" title="فایل جدید">+</button>
          <button class="btn-tiny" id="upload-file-btn" title="آپلود فایل">⬆</button>
          <input type="file" id="file-upload-input" multiple accept=".html,.css,.js,.json,.md,.txt,.svg" style="display:none">
        </div>
      </div>
      <ul id="file-list"></ul>
    </aside>

    <!-- فضای کار: ادیتور + پیش‌نمایش -->
    <div class="main-workspace">
      <!-- تب‌های فایل‌ها -->
      <div class="editor-tabs" id="editor-tabs"></div>

      <div class="workspace-split">
        <!-- ادیتور کد -->
        <div class="editor-pane">
          <div id="editor-wrapper">
            <p class="no-file">در حال آماده‌سازی ادیتور...</p>
          </div>
        </div>

        <!-- پیش‌نمایش زنده -->
        <div class="preview-pane">
          <div class="preview-toolbar">
            <span>پیش‌نمایش زنده</span>
            <span style="font-size:0.75rem;opacity:0.7">تغییرات خودکار اعمال می‌شن</span>
          </div>
          <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- نوار وضعیت -->
  <div class="status-bar" id="status-bar">آماده</div>

  <!-- مودال افزودن فایل -->
  <div id="add-file-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>فایل جدید</h3>
        <button class="modal-close" id="close-add-file">×</button>
      </div>
      <form id="add-file-form">
        <div class="form-group">
          <label for="new-file-name">اسم فایل (با پسوند)</label>
          <input type="text" id="new-file-name" placeholder="مثلاً about.html یا style.css" required>
        </div>
        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px;">
          اگر پسوند نذاری، به صورت پیش‌فرض .html در نظر گرفته می‌شه.
        </p>
        <button type="submit" class="btn btn-primary">بساز</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
